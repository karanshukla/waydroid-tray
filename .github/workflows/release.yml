name: Release

# Push a tag like v0.2.0 to publish a release with prebuilt binaries.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Static musl binaries run on any distro. The dependencies are pure
      # Rust, so rust-lld can link the arm64 one without a cross toolchain.
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
      - name: Build and package
        run: |
          for arch in x86_64 aarch64; do
            cargo build --release --locked --target "$arch-unknown-linux-musl"
            dir="dist/waydroid-tray"
            rm -rf "$dir" && mkdir -p "$dir"
            cp -r "target/$arch-unknown-linux-musl/release/waydroid-tray" icons waydroid-tray.desktop waydroid-tray.service install.sh "$dir"
            tar -czf "dist/waydroid-tray-$arch-linux.tar.gz" -C dist waydroid-tray
          done
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes dist/*.tar.gz

  # Trusted publishing: crates.io trusts this workflow file in this repo, so
  # there's no stored token. The first publish had to use one.
  crates-io:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Check the tag matches Cargo.toml
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          test "$GITHUB_REF_NAME" = "v$version" || { echo "tag $GITHUB_REF_NAME, Cargo.toml $version" >&2; exit 1; }
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
