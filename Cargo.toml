[package]
name = "waydroid-tray"
version = "0.1.0"
edition = "2024"

[dependencies]
ksni = "0.3.6"
tokio = { version = "1.53.1", features = ["rt", "macros", "time"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
