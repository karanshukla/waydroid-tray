[package]
name = "waydroid-tray"
version = "0.2.0"
edition = "2024"

[dependencies]
futures-util = { version = "0.3", default-features = false }
ksni = "0.3.6"
tokio = { version = "1.53.1", features = ["rt", "macros", "time", "process"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dev-dependencies]
serde = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
