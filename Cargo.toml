[package]
name = "waydroid-tray"
version = "0.1.1"
edition = "2024"
description = "System tray icon for Waydroid: session status, start/stop, freeze, and an app launcher"
license = "MIT OR Apache-2.0"
repository = "https://github.com/karanshukla/waydroid-tray"
readme = "README.md"
keywords = ["waydroid", "tray", "kde", "plasma", "android"]
categories = ["command-line-utilities", "gui"]
exclude = [".github/"]

[dependencies]
futures-util = { version = "0.3", default-features = false }
ksni = "0.3.6"
tokio = { version = "1.53.1", features = ["rt", "macros", "time", "process"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dev-dependencies]
serde = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
